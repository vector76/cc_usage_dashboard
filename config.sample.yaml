# Claude Usage Dashboard configuration.
#
# The trayapp created this file automatically on first run (it is a copy of
# the built-in sample, config.sample.yaml). Every setting has a built-in
# default; the commented entries below show those defaults. Uncomment and
# edit a setting to change it, then restart the trayapp — the file is read
# once at startup. Deleting this file is safe: the app falls back to the
# same defaults and recreates the file on the next start.
#
# Full reference: docs/configuration.md.

# ---------------------------------------------------------------------------
# Slack-activation profiles
#
# These decide when the slack signal recommends releasing low-priority
# "free" work to the external job queue. Each profile is a list of
#
#     [time_pct, remaining_pct]
#
# points in the same orientation as the dashboard burn-down charts: at
# time_pct percent of the window elapsed, slack is available while the
# quota remaining is at or above remaining_pct percent. Between points the
# boundary interpolates linearly; before the first and after the last point
# it extends flat. The dashboard's green zone is drawn from these exact
# points, so the chart always agrees with the gate.
# ---------------------------------------------------------------------------
slack:
  # Session (5-hour) window: require 98% remaining until just past half the
  # window, then relax along a line to 50% remaining at the window's end.
  session_profile:
    - [0, 98]
    - [52, 98]
    - [100, 50]

  # Weekly window: allow slack above 80% remaining early in the week,
  # relaxing to 10% remaining by week's end. The same boundary is applied
  # to the "Fable" weekly sub-row whenever the usage page reports one.
  weekly_profile:
    - [0, 80]
    - [30, 80]
    - [100, 10]

  # Refuse slack when the newest usage snapshot is older than this many
  # seconds (the userscript has stopped posting).
  # baseline_max_age_seconds: 480

  # Legacy scalar thresholds. Consulted only when the corresponding
  # *_profile above is removed from this file; the profile defaults above
  # are exactly equivalent to these values.
  # session_surplus_threshold: 0.50
  # weekly_surplus_threshold: 0.10
  # session_absolute_threshold: 0.98
  # weekly_absolute_threshold: 0.80

# Leave unset to resolve automatically: $USAGE_DASHBOARD_DB, else an existing
# usage.db in the working directory (build-from-checkout), else the per-user
# data dir — %LOCALAPPDATA%\usage_dashboard\ on Windows,
# ~/.local/share/usage-dashboard/ elsewhere. See docs/configuration.md
# "Database location". Set an explicit path here to override.
# database:
#   path: ""

# http:
#   port: 27812
#   bind:
#     - 127.0.0.1

# ---------------------------------------------------------------------------
# Uplink (optional)
#
# Forward this machine's usage events to another trayapp, so a VM's or a
# secondary machine's token spend lands in the primary host's database
# alongside its own. Set this on the SENDING machine only; the receiving
# host leaves it empty and just needs http.bind above extended to an
# interface the sender can reach.
#
# The value is the receiver's base URL with no path — the forwarder appends
# the endpoint itself. Events are forwarded raw (tokens and model, not
# cost), so the receiver prices and derives everything from its own tables.
# Forwarding is idempotent: re-sent events collide on the receiver's
# UNIQUE(session_id, message_id) and are discarded.
#
# Empty (the default) disables forwarding entirely.
#
#   uplink:
#     url: "http://192.168.56.1:27812"
# ---------------------------------------------------------------------------
# uplink:
#   url: ""

# claude:
#   projects_dir: "~/.claude/projects"
#   cowork_sessions_dir: "%APPDATA%\\Claude\\local-agent-mode-sessions"

# ---------------------------------------------------------------------------
# OAuth usage polling. Reads the same account-scoped quota percentages the
# userscript scrapes from claude.ai, but as structured JSON straight from
# Anthropic's API, using the access token Claude Code already stores. No
# browser tab needs to be open, and the reset boundaries arrive as exact
# timestamps instead of hints like "Resets Thu 3:50 AM".
#
# Reading usage does not consume it: repeated polls were observed not to
# open a 5-hour window. That is what separates this from invoking Claude
# Code to read the figures, which does.
#
# Off by default. Enabling it does NOT disable the userscript — run both
# and their snapshots are recorded under different sources, so the two can
# be compared rather than silently merged.
#
# Known gap: the access token lives about 8 hours and is refreshed only
# when Claude Code itself runs, so a machine idle overnight will see this
# source go quiet until the next session. That is reported as "temporarily
# unavailable", not as a broken scraper.
#
# poll_interval_seconds is floored at 30. The default of 180 is deliberate:
# the endpoint is undocumented, its rate limits are unpublished, and the
# figures move in whole percentage points.
#
# credentials_path empty means the standard location, honoring
# CLAUDE_CONFIG_DIR.
# ---------------------------------------------------------------------------
# oauth_usage:
#   enabled: false
#   poll_interval_seconds: 180
#   credentials_path: ""

# Price table override; empty means "use a prices.yaml found next to the
# exe (or in the other search dirs), else the table embedded in the binary".
# pricing:
#   table_path: ""

# tailer:
#   poll_interval_ms: 1000

# logging:
#   level: info        # debug | info | warn | error
#   # Empty resolves automatically: stderr when a console is attached, else a
#   # rotated trayapp.log in the data dir next to usage.db. A -H=windowsgui
#   # build has no console, so leaving this empty still gets you logs.
#   file: ""

# retention:
#   parse_errors_days: 30
#   slack_samples_days: 90

# enable_slack_sampling: false
